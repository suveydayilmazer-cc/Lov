<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalp Animasyonu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            position: relative;
            width: 600px;
            height: 600px; 
            /* Kalbi genel olarak biraz daha yukarı taşımak için üstten boşluk/transform ayarı */
            transform: translateY(-30px);
        }

        .word {
            position: absolute;
            color: #ff1a40; /* Canlı kırmızı tonu */
            font-weight: 600;
            opacity: 0;
            transform: scale(0.1);
            transition: opacity 0.8s ease, transform 0.8s ease;
            text-shadow: 0 0 6px rgba(255, 26, 64, 0.5);
            white-space: nowrap;
            font-size: 11px; 
        }

        .word.visible {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <div class="container" id="heart-container"></div>

    <script>
        const languages = [
            "Seni Seviyorum", "I Love You", "Te amo", "Je t'aime", 
            "Ich liebe dich", "Ti amo", "Я тебя люблю", "Te quiero", 
            "Kocham Cię", "Mahal kita", "Minä rakastan sinua", "Jeg elsker dig", 
            "Σ' αγαπώ", "Volim te", "Szeretlek", "Te dua", "Ik hou van jou", "Milujem ťa",
            "Saranghae", "Wo ai ni", "Aishiteru", "Te iubesc", "Obicham te", 
            "Aloha wau ia `oe", "Ngiyakuthanda", "Nakupenda", "Es tevi mīlu", 
            "Aš tave myliu", "Ma armastan sind", "Eg elski teg", 
            "Ani ohev otakh", "Ana behibak", "Men seni sevaman", "Seni söýýärin", 
            "Ez te hezkir dikim", "Mən səni sevirəm", "çünki sevirem"
        ];

        const container = document.getElementById('heart-container');
        const wordElements = [];

        // 1. Dış çerçeve noktaları
        const borderPointsCount = 75;
        const borderPoints = [];
        for (let i = 0; i < borderPointsCount; i++) {
            const t = (i / borderPointsCount) * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            borderPoints.push({ x, y, type: 'border' });
        }

        // 2. İç dolgu noktaları (Üst üste binmeyi önleyen ve boşlukları kapatan optimize aralık)
        const innerPoints = [];
        for (let x = -13; x <= 13; x += 1.25) {
            for (let y = -14; y <= 11; y += 1.25) {
                if (Math.pow(x/3, 2) + Math.pow(y/3, 2) - 1 < 3.2) {
                    const checkDist = borderPoints.some(p => Math.hypot(p.x - x, p.y - y) < 1.1);
                    if (!checkDist) {
                        innerPoints.push({ x, y, type: 'inner' });
                    }
                }
            }
        }

        // İç kısımdaki yazıları yukarıdan aşağıya doğru sıralama
        innerPoints.sort((a, b) => a.y - b.y);

        // Birleştirme: Önce çerçeve, sonra yukarıdan aşağıya iç kısım
        const allPoints = [...borderPoints, ...innerPoints];

        const assignedLanguages = [];
        for (let i = 0; i < allPoints.length; i++) {
            assignedLanguages.push(languages[i % languages.length]);
        }

        allPoints.forEach((p, index) => {
            const span = document.createElement('span');
            span.classList.add('word');
            span.innerText = assignedLanguages[index];
            
            const posX = 300 + p.x * 16; 
            const posY = 300 + p.y * 16;
            
            span.style.left = posX + 'px';
            span.style.top = posY + 'px';

            container.appendChild(span);
            wordElements.push(span);
        });

        // Yavaş ve akıcı animasyon hızı (120ms)
        let currentIndex = 0;

        function animateHeart() {
            if (currentIndex < wordElements.length) {
                wordElements[currentIndex].classList.add('visible');
                currentIndex++;
                setTimeout(animateHeart, 120); 
            }
        }

        window.onload = () => {
            setTimeout(animateHeart, 500);
        };
    </script>

</body>
</html>
